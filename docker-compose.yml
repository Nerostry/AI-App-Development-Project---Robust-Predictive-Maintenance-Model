version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pm-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pm-network

  ingest-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:29092
      PORT: 3001
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - kafka
    networks:
      - pm-network

  data-processing-service:
    build:
      context: ./data_processing_service
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKER: kafka:29092
    volumes:
      - ./uploads:/app/uploads
      - ./data_processing_service:/app
    depends_on:
      - kafka
    networks:
      - pm-network

  predictive-maintenance-service:
    build:
      context: .
      dockerfile: predictive_maintenance_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/saved_models
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./saved_models:/app/saved_models
    depends_on:
      - kafka
    networks:
      - pm-network

  ui-service:
    build:
      context: ./User_InterFace
      dockerfile: dockerfile
    ports:
      - "8501:8501"
    environment:
      MODEL_SERVICE_HOST: predictive-maintenance-service
    depends_on:
      - predictive-maintenance-service
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge